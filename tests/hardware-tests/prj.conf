CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096
# CONFIG_ZTEST_NEW_API=y
# Debugger Support
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE_SUBSYS=y
#CONFIG_CONSOLE_GETLINE=y

# RTT Segger Support
CONFIG_PRINTK=y
CONFIG_RTT_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y


# Add any sensor or driver configs your code needs to compile here
# test_adc
CONFIG_ADC=y

# test_sensor
CONFIG_SENSOR=y

# test_rtc
CONFIG_I2C=y
CONFIG_COUNTER=y
CONFIG_COUNTER_MAXIM_DS3231=y
CONFIG_POSIX_API=y
CONFIG_NEWLIB_LIBC=y

# test_lorawan
# LoRa Support
CONFIG_LORA=y

# LoRaWAN Support
CONFIG_LORAWAN=y
CONFIG_HAS_SEMTECH_LORAMAC=y
CONFIG_LORAMAC_REGION_EU868=y
CONFIG_LORAWAN_SYSTEM_MAX_RX_ERROR=10
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
